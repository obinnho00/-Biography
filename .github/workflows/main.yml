name: Deploy Biography to Render with Docker

on:
  push:
    branches:
      - main  # Trigger deployment on push to the main branch

env:
  DOCKER_IMAGE: '${{ secrets.DOCKER_USER_NAME }}/Biography'  # Name for the Docker image, stored in Docker Hub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment for FastAPI (backend)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install Python dependencies for FastAPI
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Set up Node.js environment for React (frontend)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # or any version you're using for React

      # Step 5: Install Node.js dependencies for React
      - name: Install React dependencies
        run: |
          cd bio 
          npm install

      # Step 6: Build React app (optional, if you need to build your React app)
      - name: Build React app
        run: |
          cd bio
          npm run build

      # Step 7: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASS }}

      # Step 8: Build Docker image for FastAPI and React
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker push ${{ env.DOCKER_IMAGE }}:latest

      # Step 9: Trigger Deploy on Render via Deploy Hook
      - name: Deploy to Render
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

